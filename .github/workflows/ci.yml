name: Check Airlock
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:extension
# Builds are compile checks. Runtime AI tests require local Chrome and Firebase setup.
# No production credentials or App Check tokens are required for this workflow.
